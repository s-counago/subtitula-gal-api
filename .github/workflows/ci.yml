name: Verify API

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: api-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            processing-worker/package-lock.json
      - run: npm ci
      - run: npm --prefix processing-worker ci
      - run: npm run test:bootstrap
      - run: npm run cf-typegen
      - run: npm run typecheck:worker
      - run: npm run test:processing-worker
      - run: npm run test:search-evaluation
      - run: npm run test:production-config
      - run: npm run deploy:dev:dry-run
      - run: ./mvnw -B -DskipTests compile
      - run: ./mvnw -B test
