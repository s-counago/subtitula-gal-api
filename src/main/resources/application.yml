spring:
  application:
    name: subtitula-api
  profiles:
    # dev and prod are labels for different runtime secrets/URLs. Both inherit
    # the exact same hosted configuration and run the same application image.
    group:
      dev: hosted
      prod: hosted
  # Safe default for local/tests. Hosted development can explicitly disable
  # delivery until a sender domain exists; production keeps SMTP fail-fast.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # The public callback differs only by environment. Hosted traffic
            # returns through the frontend's same-origin /backend gateway.
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
            scope: [openid, email, profile]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/subtitula}
    username: ${DB_USER:subtitula}
    password: ${DB_PASSWORD:subtitula}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never   # Flyway owns the session schema (V2)
    timeout: 30d
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

server:
  # App runs behind a TLS-terminating Cloudflare Worker: honour
  # X-Forwarded-* so getRemoteAddr()/isSecure() reflect the real client, not the proxy.
  # This makes per-IP rate limiting effective and lets the Secure session cookie be set.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

app:
  capabilities:
    durable-institutional-upload: ${CAPABILITY_DURABLE_INSTITUTIONAL_UPLOAD:false}
    normalized-transcript: ${CAPABILITY_NORMALIZED_TRANSCRIPT:true}
    exception-review: ${CAPABILITY_EXCEPTION_REVIEW:false}
    automatic-agenda: ${CAPABILITY_AUTOMATIC_AGENDA:false}
    structured-guide: ${CAPABILITY_STRUCTURED_GUIDE:false}
    public-publication: ${CAPABILITY_PUBLIC_PUBLICATION:false}
    lexical-search: ${CAPABILITY_LEXICAL_SEARCH:false}
    hybrid-search: ${CAPABILITY_HYBRID_SEARCH:false}
  processing:
    internal-hmac-secret: ${INTERNAL_API_HMAC_SECRET:}
  search:
    # Blank disables query/click persistence. When configured, only a keyed
    # digest and bounded filter metadata are stored; raw query text is never stored.
    analytics-hmac-secret: ${SEARCH_ANALYTICS_HMAC_SECRET:}
    embedding-model: ${SEARCH_EMBEDDING_MODEL:@cf/baai/bge-m3}
    embedding-dimensions: ${SEARCH_EMBEDDING_DIMENSIONS:1024}
    minimum-semantic-similarity: ${SEARCH_MINIMUM_SEMANTIC_SIMILARITY:0.32}
    embedding-microusd-per-million-input-tokens: ${SEARCH_EMBEDDING_MICRO_USD_PER_MILLION_INPUT_TOKENS:12000}
    estimated-chars-per-token: ${SEARCH_ESTIMATED_CHARS_PER_TOKEN:3}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:3000}
  email:
    provider: ${EMAIL_PROVIDER:smtp}
    delivery-required: ${EMAIL_DELIVERY_REQUIRED:false}
    from: ${APP_EMAIL_FROM:no-reply@subtitula.gal}
  elevenlabs:
    base-url: https://api.elevenlabs.io
    api-key: ${ELEVENLABS_API_KEY:}
    model-id: ${ELEVENLABS_MODEL_ID:scribe_v2}
    # Force Galician: auto-detect hears real-world Galician as Spanish.
    # "glg" live-verified 2026-07-02 (see src/test/resources/fixtures/README.md).
    language-hint: ${ELEVENLABS_LANGUAGE_HINT:glg}
