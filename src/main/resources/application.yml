spring:
  application:
    name: subtitula-api
  profiles:
    # dev and prod are labels for different runtime secrets/URLs. Both inherit
    # the exact same hosted configuration and run the same application image.
    group:
      dev: hosted
      prod: hosted
  # Safe default for local/tests. Hosted development can explicitly disable
  # delivery until a sender domain exists; production keeps SMTP fail-fast.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [openid, email, profile]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/subtitula}
    username: ${DB_USER:subtitula}
    password: ${DB_PASSWORD:subtitula}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never   # Flyway owns the session schema (V2)
    timeout: 30d
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

server:
  # App runs behind a TLS-terminating Cloudflare Worker: honour
  # X-Forwarded-* so getRemoteAddr()/isSecure() reflect the real client, not the proxy.
  # This makes per-IP rate limiting effective and lets the Secure session cookie be set.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:3000}
  email:
    provider: ${EMAIL_PROVIDER:smtp}
    delivery-required: ${EMAIL_DELIVERY_REQUIRED:false}
    from: ${APP_EMAIL_FROM:no-reply@subtitula.gal}
  elevenlabs:
    base-url: https://api.elevenlabs.io
    api-key: ${ELEVENLABS_API_KEY:}
    model-id: ${ELEVENLABS_MODEL_ID:scribe_v2}
    # Force Galician: auto-detect hears real-world Galician as Spanish.
    # "glg" live-verified 2026-07-02 (see src/test/resources/fixtures/README.md).
    language-hint: ${ELEVENLABS_LANGUAGE_HINT:glg}
