# Production must fail fast rather than silently using the local database or a
# blank transcription key when a deployment is incompletely configured.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

server:
  servlet:
    session:
      cookie:
        secure: true

app:
  cors:
    allowed-origins: ${CORS_ORIGINS}
  frontend:
    base-url: ${FRONTEND_URL}
  email:
    from: ${APP_EMAIL_FROM}
  elevenlabs:
    api-key: ${ELEVENLABS_API_KEY}
